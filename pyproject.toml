[project]
name = "hledger-tui"
version = "0.1.2"
description = "A Textual TUI to view HLedger data."
authors = [
    {name = "Luca Bello", email = "lusgabello@gmail.com"},
]
readme = "README.md"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
  "textual",
  "textual-dev",
  "textual-plotext",
  "sh",
  "typer",
  "dataconfy",
]

[dependency-groups]
dev = [
    "ruff",
    "pyright",
    "codespell",
    "vulture",
    "pytest",
    "pytest-cov",
    "pytest-sugar",
    "actionlint-py",
    "uv-secure",
]

[project.urls]
Homepage = "https://github.com/lucabello/hledger-tui"
Documentation = "https://github.com/lucabello/hledger-tui"
Repository = "https://github.com/lucabello/hledger-tui"
Issues = "https://github.com/lucabello/hledger-tui/issues"
Changelog = "https://github.com/lucabello/hledger-tui/releases"


# Building and publishing
[build-system]
requires = ["uv_build>=0.9.2,<0.11.0"]
build-backend = "uv_build"

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true

# Tools configuration
[tool.ruff]
line-length = 99

[tool.lint.pydocstyle]
convention = "google"

[tool.codespell]
skip = ".git,build,venv*"
ignore-words-list = "assertIn"

[tool.vulture]
min_confidence = 80
ignore_names = ["parameters"]
